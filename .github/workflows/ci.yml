name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # regresión completa todos los días, 04:00 hora de Lima
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitarias + integración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unitarias, JaCoCo e integración (Testcontainers)
        working-directory: backend
        run: mvn -B verify
      - name: Reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    name: Frontend (tipos + unitarias + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  e2e:
    name: E2E Playwright
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el sistema completo con perfil test
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Smoke (en PR) o regresión completa (main, nightly)
        working-directory: e2e
        env:
          CI: "true"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --grep @smoke
          else
            npx playwright test
          fi
      - name: Instalar k6
        if: github.event_name != 'pull_request'
        uses: grafana/setup-k6-action@v1
      - name: Prueba de carga corta (k6 smoke)
        if: github.event_name != 'pull_request'
        uses: grafana/run-k6-action@v1
        with:
          path: perf/carga-basica.js
        env:
          PERFIL: smoke
      - name: Escaneo de seguridad (OWASP ZAP baseline)
        if: github.event_name != 'pull_request'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
      - name: Reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: e2e/playwright-report/
      - name: Logs del backend si algo falla
        if: failure()
        run: docker compose logs backend
